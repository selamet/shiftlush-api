[project]
name = "shiftlush-api"
version = "0.1.0"
description = "ShiftLush — elevator maintenance tracking API"
requires-python = ">=3.13,<3.14"

dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-filter>=25.1",
    "djangorestframework-simplejwt>=5.5",
    "django-cors-headers>=4.7",
    "argon2-cffi>=25.1",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
    # Django's own cache backend talks to Redis through redis-py. Production
    # only in practice — locally the cache is in memory — but a runtime
    # dependency for the same reason psycopg is one.
    "redis>=5.2",
    # uuid7 is not in the standard library; uuid4 would fragment the B-tree
    # index on tables that grow to hundreds of thousands of rows.
    "uuid-utils>=0.11",
    "django-storages[s3]>=1.14",
    "cryptography>=45.0",
    "qrcode[pil]>=8.2",
    # Production only in practice, but a runtime dependency rather than a group:
    # the image must not be able to build without the server that runs it.
    "gunicorn>=23.0",
    # Serves the admin's own static files. Putting nginx in front of Django for
    # a handful of CSS files would add a container to every deployment for a
    # problem this solves in one middleware.
    "whitenoise>=6.8",
    "sentry-sdk[django]>=2.20",
]

[dependency-groups]
dev = [
    # Declared rather than relied on as a transitive dependency of
    # drf-spectacular: the contract tests read openapi/v1.yaml directly, and a
    # dependency that only works by accident breaks on the next upgrade.
    "pyyaml>=6.0",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "pytest-cov>=6.2",
    "factory-boy>=3.3",
    "ruff>=0.12",
    "mypy>=1.17",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs>=3.16",
    "django-zen-queries>=2.1",
]
# WeasyPrint needs cairo and pango system libraries. It is only used to render
# the QR label PDF, so it is kept out of the default install: a developer who
# never touches label printing should not need the native stack.
pdf = ["weasyprint>=66.0"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]
# The specification is a document, not source. Ruff reformats Python blocks
# inside Markdown, which rewrites the spec's examples behind our back.
extend-exclude = ["*.md", "db.sqlite3"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S", "C4", "RUF"]
ignore = [
    "S101",   # pytest relies on assert
    "RUF001", # ambiguous unicode is expected in Turkish locale files
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "RUF012"]
"config/settings/*" = ["F403", "F405"]
# Django's Meta.constraints and Meta.indexes are lists by design; annotating
# every one of them as ClassVar adds noise without adding safety.
"**/models.py" = ["RUF012"]
# Meta.fields, read_only_fields and permission_classes are lists by DRF's own
# convention; annotating each as ClassVar adds noise without adding safety.
# Globbed rather than exact so that an app splitting its API across more than
# one module (auth versus team management, say) does not need a new entry here.
"**/*serializers.py" = ["RUF012"]
"**/*views.py" = ["RUF012"]
"core/viewsets.py" = ["RUF012"]
# Test fixtures hold literal credentials by definition; flagging them is noise
# that trains people to ignore the rule where it matters.
"tests/**" = ["S105", "S106", "S107", "RUF059"]
# Seed data is demonstration material: the password is meant to be known and
# the randomness only has to be repeatable, not unguessable.
"core/demo.py" = ["S105", "S311", "RUF059"]
# Same reason, for the one credential a demonstration is handed. It is checked
# against AUTH_PASSWORD_VALIDATORS at run time, which is the rule that matters.
"core/management/commands/create_demo_account.py" = ["S105"]
# A developer tool, run by hand when the yearly address refresh lands. It reads
# one hard-coded https URL and is not part of the running application.
"apps/address/data/build.py" = ["S310"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

# Libraries that ship neither a py.typed marker nor stubs on PyPI. Listed one by
# one instead of switching ignore_missing_imports on globally: a global switch
# would also swallow the day a dependency starts publishing types, or the day
# someone imports a module that does not exist at all.
[[tool.mypy.overrides]]
module = [
    "environ.*",
    "boto3.*",
    "botocore.*",
    "qrcode.*",
    # Only installed with the `pdf` group, so `make mypy` would otherwise fail
    # for a developer who never renders a label.
    "weasyprint.*",
    "django_filters.*",
    "zen_queries.*",
]
ignore_missing_imports = true

# Consequence of the entry above: with no stubs, `django_filters.FilterSet` is
# Any, and strict mode refuses to subclass Any. Subclassing it is the library's
# documented API, and the alternative — a `type: ignore` on seven class
# statements — hides any *other* error mypy finds on those lines.
[[tool.mypy.overrides]]
module = ["apps.*.api.v1.views", "apps.users.api.v1.team_views"]
disallow_subclassing_any = false

# Tests are checked, but not for their own annotations. Every rule that finds a
# mistake stays on: a test calling a service with the wrong argument type, or
# reading an attribute a model does not have, still fails the gate. What is off
# is the paperwork — `def test_x() -> None` on 500 test functions, and spelling
# out the generic parameters of the fixtures they build — which would have bought
# a five-hundred-line diff and no defect.
#
# This is the one place the gate is looser than section 19 asks for. Turning
# these back on is a mechanical afternoon; it should happen when the suite next
# has a reason to be touched wholesale, not as a prerequisite for having a gate.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --reuse-db"

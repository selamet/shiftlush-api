name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # The suite runs on SQLite locally so nothing has to be installed, but CI
      # runs it against the engine production uses. Trigram search and JSONB
      # operators are not covered by the SQLite run, and those are exactly the
      # places where the two engines disagree.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shiftlush
          POSTGRES_PASSWORD: shiftlush
          POSTGRES_DB: shiftlush
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # oasdiff needs the previous commit's spec to compare against.
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # WeasyPrint renders through Pango and Cairo, which are system libraries
      # rather than wheels. Without them the QR label tests skip themselves and
      # a broken template reaches production unnoticed.
      - name: PDF rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - run: uv sync --locked --group pdf

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        # Section 19 asks for mypy alongside ruff and pytest. It was configured
        # and never run, which is the same as not having it: the first run found
        # 736 errors. Placed before the tests so a type error is reported in
        # seconds rather than after the database has been built.
        run: uv run mypy .

      - name: No Turkish in product code
        # Turkish belongs in locale catalogues, templates and data files. A
        # Turkish string in a module means user-facing text was compiled into
        # the API, where it cannot be translated or corrected without a deploy.
        #
        # Two deliberate exemptions, both about handling Turkish rather than
        # displaying it: core/text.py holds the letter table the whole
        # normaliser is built on, and the tests assert on the letters that
        # actually break.
        run: |
          found=$(grep -rlP '[çğıöşüÇĞİÖŞÜ]' --include='*.py' apps core config \
                  | grep -v -E '(locale/|templates/|/data/|core/text\.py)' || true)
          if [ -n "$found" ]; then
            echo "Turkish characters found in product code:"
            echo "$found"
            exit 1
          fi

      - name: Migrations are complete
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        env:
          DATABASE_URL: postgres://shiftlush:shiftlush@localhost:5432/shiftlush
        run: uv run pytest --cov=core --cov=apps --cov-report=term-missing

      - name: A clean database can be brought up from nothing
        env:
          DATABASE_URL: postgres://shiftlush:shiftlush@localhost:5432/shiftlush
        run: |
          uv run python manage.py migrate
          uv run python manage.py load_address_data
          uv run python manage.py seed_demo_data

      - name: The contract matches the code
        # The spec is generated, so a stale committed copy means the frontend is
        # building against something the backend no longer serves.
        run: |
          uv run python manage.py spectacular --file openapi/v1.yaml --fail-on-warn
          git diff --exit-code openapi/v1.yaml \
            || (echo "openapi/v1.yaml is out of date. Run 'make spec'." && exit 1)

      - name: No unannounced breaking changes
        # "Unannounced" is the operative word, and until now there was no way to
        # announce one — the step simply failed. A breaking change is sometimes
        # correct: this check first fired on a commit that fixed a contract
        # describing a response the server had never sent. Removing the check
        # for that would have removed it for the accidental case too.
        #
        # The escape hatch is the thing we want to happen anyway: say so in
        # CHANGELOG-API.md, in the same commit, where a reviewer sees it in the
        # diff. An accidental break does not touch that file.
        run: |
          git show HEAD~1:openapi/v1.yaml > /tmp/previous.yaml 2>/dev/null || exit 0
          if docker run --rm -v /tmp:/specs -v "$PWD/openapi:/current" \
              tufin/oasdiff breaking /specs/previous.yaml /current/v1.yaml --fail-on ERR; then
            exit 0
          fi
          if git diff --name-only HEAD~1 HEAD | grep -qx CHANGELOG-API.md; then
            echo "::notice::Breaking contract change, announced in CHANGELOG-API.md."
            exit 0
          fi
          echo "::error::The contract broke and CHANGELOG-API.md was not touched."
          echo "If the break is intended, record it there in this commit. If it"
          echo "is not, the diff above is telling you what a client will lose."
          exit 1

      - name: Report whether the frontend holds this contract
        # A REPORT, NOT A CHECK. It guarantees nothing, and when it cannot read
        # the frontend's copy it says exactly that rather than staying quiet and
        # letting silence read as agreement.
        #
        # The guarantee lives in shiftlush-web, where `npm run lint:contract`
        # compares against this repository's published spec and fails closed.
        # It cannot live here. On a backend pull request the frontend is
        # NECESSARILY behind until this merges, so gating here would deadlock
        # every backend change against a sync that cannot have happened yet. On
        # a frontend pull request the backend's change is already on main, so
        # syncing is possible and blocking is the right answer. That asymmetry
        # is why the gate is over there and only the heads-up is here.
        #
        # shiftlush-web is public, so reading its copy needs no token.
        run: |
          here=$(shasum -a 256 openapi/v1.yaml | cut -d' ' -f1)
          if curl -fsSL --max-time 20 -o /tmp/web-v1.yaml \
              https://raw.githubusercontent.com/selamet/shiftlush-web/main/openapi/v1.yaml \
              && grep -q '^openapi: 3\.' /tmp/web-v1.yaml; then
            there=$(shasum -a 256 /tmp/web-v1.yaml | cut -d' ' -f1)
          else
            echo "::notice::Could not read shiftlush-web's copy of the contract."
            echo "No comparison was made. This step proves nothing either way;"
            echo "the check that does is 'npm run lint:contract' in that repository."
            exit 0
          fi
          if [ "$here" = "$there" ]; then
            echo "shiftlush-web holds this contract ($here)."
            exit 0
          fi
          echo "::notice::shiftlush-web does not hold this contract yet."
          echo "  here (shiftlush-api)  $here"
          echo "  there (shiftlush-web) $there"
          echo ""
          echo "Expected on a pull request that changes the contract: the frontend"
          echo "cannot sync until this lands. Once it has, run 'npm run api:sync'"
          echo "in shiftlush-web, which is also what its CI will tell you."

{# Inline styles only, and a single-column table layout. Mail clients strip
   <style> blocks and ignore flexbox; this renders the same in Outlook as in
   Gmail, which is the only test that matters here. #}
<!doctype html>
<html lang="tr">
  <body style="margin:0;padding:24px;background:#f4f4f5;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;border:1px solid #e4e4e7;">
      <tr>
        <td style="padding:28px 32px 8px 32px;">
          <div style="font-size:18px;font-weight:600;letter-spacing:-0.01em;">ShiftLush</div>
        </td>
      </tr>
      <tr>
        <td style="padding:8px 32px 28px 32px;font-size:15px;line-height:1.6;">
          {% block content %}{% endblock %}
        </td>
      </tr>
    </table>
    <div style="max-width:560px;margin:16px auto 0 auto;font-size:12px;line-height:1.5;color:#71717a;">
      {% block footer %}{% endblock %}
    </div>
  </body>
</html>

    PortalElevator:
      type: object
      description: |-
        The lift's open correction deadline, for every elevator read.

        A red or yellow label carries a legal deadline that ends in a seal, and the
        next periodic inspection a year away is false reassurance beside it (audit
        P1-06). Read from the annotations of `inspections.services.with_open_correction`
        on a list; worked out for the one lift otherwise.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        building:
          type: string
          format: uuid
          readOnly: true
        building_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ElevatorStatus'
          readOnly: true
        last_maintenance_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        next_maintenance_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        inspection_label:
          allOf:
          - $ref: '#/components/schemas/InspectionLabelEnum'
          readOnly: true
        next_inspection_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        correction_deadline:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: The current inspection's correction deadline while a defect
            is still open; null when nothing is open.
        correction_days_left:
          type: integer
          nullable: true
          readOnly: true
          description: Days until `correction_deadline` by the Istanbul calendar;
            negative once passed; null when nothing is open.
        open_nonconformities:
          type: integer
          readOnly: true
          description: Open defects of the current inspection (and of the periodic
            one a follow-up follows).
      required:
      - building
      - building_name
      - correction_days_left
      - correction_deadline
      - id
      - inspection_label
      - last_maintenance_date
      - name
      - next_inspection_date
      - next_maintenance_date
      - open_nonconformities
      - status

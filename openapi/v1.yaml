  /api/v1/planned-visits/:
    get:
      operationId: planned_visits_list
      description: |-
        The monthly maintenance plan.

        Composed from mixins rather than a TenantViewSet because nothing here is
        created or deleted by a client — the `plan_maintenance` job writes the rows
        and a recorded visit closes them — so there is no create for the router to
        publish, and no delete.

        Technicians read their own rows and the unassigned rows of the customers
        they are assigned to: the usual customer narrowing, then within it only
        what is theirs to do or still open for anyone. Another technician's row
        is a 404.
      parameters:
      - in: query
        name: customer
        schema:
          type: string
          format: uuid
      - in: query
        name: district
        schema:
          type: integer
      - in: query
        name: due_before
        schema:
          type: string
          format: date
      - in: query
        name: elevator
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: period
        schema:
          type: string
        description: 'The month, as "YYYY-MM". Required: the plan is always read a
          month at a time.'
        required: true
      - in: query
        name: planned_from
        schema:
          type: string
          format: date
        description: Rows planned on or after this day. Rows with no planned day are
          left out.
      - in: query
        name: planned_to
        schema:
          type: string
          format: date
        description: Rows planned on or before this day. Rows with no planned day
          are left out.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - done
          - planned
        description: |-
          * `planned` - Planned
          * `done` - Done
          * `cancelled` - Cancelled
      - in: query
        name: technician
        schema:
          type: string
        description: A user id, or "me" for the signed-in user.
      - in: query
        name: unassigned
        schema:
          type: boolean
      - in: query
        name: unscheduled
        schema:
          type: boolean
        description: 'true: only rows with no planned day; false: only rows with one.'
      tags:
      - planned-visits
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlannedVisitReadList'
          description: ''

    PlannedVisitRead:
      type: object
      description: |-
        One row of the plan, with every name the screen prints.

        The names are joined in by the viewset's select_related, so a page of rows
        is one query — the plan screen and the technician's list both show the
        whole month at once.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        elevator:
          type: string
          format: uuid
          readOnly: true
        elevator_name:
          type: string
          readOnly: true
        building:
          type: string
          format: uuid
          readOnly: true
        building_name:
          type: string
          readOnly: true
        neighborhood_name:
          type: string
          readOnly: true
          nullable: true
        district:
          type: integer
          readOnly: true
          nullable: true
        district_name:
          type: string
          readOnly: true
          nullable: true
        customer:
          type: string
          format: uuid
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        period:
          type: string
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
        planned_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        technician:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        technician_name:
          type: string
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PlannedVisitStatus'
          readOnly: true
        visit:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        latest_visit_status:
          readOnly: true
          nullable: true
          description: |-
            Status of the visit linked to this row: the one that closed it when `done`, the latest attempt while `planned`. Null when nobody has been yet. `planned` with a status here means tried, not done.

            * `completed` - Completed
            * `incomplete` - Incomplete
            * `access_denied` - Access denied
          oneOf:
          - $ref: '#/components/schemas/MaintenanceVisitStatus'
          - $ref: '#/components/schemas/NullEnum'
        is_overdue:
          type: boolean
          description: Still planned and past its due date, by the Istanbul calendar.
          readOnly: true
        days_overdue:
          type: integer
          nullable: true
          readOnly: true
          description: 'Days since `due_date` while the row is still planned and past
            it; null otherwise. The due date can fall before the row''s own month:
            that is how long the lift has been overdue.'
        manually_edited:
          type: boolean
          readOnly: true
        created_at:

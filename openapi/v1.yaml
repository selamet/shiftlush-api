          type: string
          format: uuid
        description: A UUID string identifying this building.
        required: true
      tags:
      - buildings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBuildingWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBuildingWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBuildingWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingRead'
          description: ''
    delete:
      operationId: buildings_destroy
      description: |-
        CRUD over a company-owned model.

        PUT is not routed: partial update is the only update verb. A full replace

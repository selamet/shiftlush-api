      - cancelled
      - done
      - overdue
      - planned
      - remaining
      - technician
      - technician_name
      - total
    TerminateRequest:
      type: object
      properties:
        terminated_at:
          type: string
          format: date
        reason:
          type: string
          maxLength: 2000
      required:
      - reason
      - terminated_at
    TokenResponse:
      type: object
      description: |-
        The body of a successful sign-in.

        Only the access token is here. The refresh token goes out as an httpOnly
        cookie and never touches JavaScript — putting it in the body would make it
        readable by any script that gets injected into the page.
      properties:
        access:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/CurrentUser'
          readOnly: true
      required:
      - access
      - user
    TransferCreateRequest:
      type: object
      description: 'What every document takes: an amount and a business date.'
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Above zero, to the cent.
        date:
          type: string
          format: date
          description: 'The business date: not after today, nor in a closed period.
            Today when omitted.'
        kind:
          $ref: '#/components/schemas/TransferKind'
        from_account:
          type: string
          format: uuid
          description: 'For `account`: credited.'
        to_account:
          type: string
          format: uuid
          description: 'For `account`: debited.'
        from_cash:
          type: string
          format: uuid
          description: 'For `cash`: money out.'
        to_cash:
          type: string
          format: uuid
          description: 'For `cash`: money in.'
        note:
          type: string
          default: ''
      required:
      - amount
      - kind
    TransferKind:
      enum:
      - account
      - cash
      type: string
      description: |-
        * `account` - Between accounts
        * `cash` - Between cash accounts
    TransferRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/TransferKind'
          readOnly: true
        from_account:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        to_account:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        from_cash:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        to_cash:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        note:
          type: string
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - cancelled_at
      - created_at
      - date
      - from_account
      - from_cash
      - id
      - kind
      - note
      - to_account
      - to_cash
    UnmatchedEnum:
      enum:
      - province
      - district
      - neighborhood
      type: string
      description: |-
        * `province` - province
        * `district` - district
        * `neighborhood` - neighborhood
    UnreadCount:
      type: object
      properties:
        count:
          type: integer
          readOnly: true
      required:
      - count
    UpdatedCount:
      type: object
      description: How many notifications a bulk action changed.
      properties:
        count:
          type: integer
          readOnly: true
      required:
      - count
    UploadUrlRequestRequest:
      type: object
      properties:
        object_type:
          $ref: '#/components/schemas/AttachmentObjectType'
        object_id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/AttachmentCategory'
        mime_type:
          $ref: '#/components/schemas/MimeTypeEnum'
        size_bytes:
          type: integer
          maximum: 10485760
          minimum: 1
      required:
      - category
      - mime_type
      - object_id
      - object_type
      - size_bytes
    UploadUrlResponse:
      type: object
      properties:
        upload_url:
          type: string
          format: uri
        storage_key:
          type: string
        expires_in:
          type: integer
        content_type:
          type: string
      required:
      - content_type
      - expires_in
      - storage_key
      - upload_url
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRole'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        certificate_number:
          type: string
          readOnly: true
        certificate_valid_until:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_login_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        assigned_customer_ids:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_customer_ids
      - certificate_number
      - certificate_valid_until
      - created_at
      - email
      - first_name
      - full_name
      - id
      - is_active
      - is_email_verified
      - last_login_at
      - last_name
      - phone
      - role
    UserRole:
      enum:
      - owner
      - admin
      - operations
      - technician
      - accountant
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `operations` - Operations
        * `technician` - Technician
        * `accountant` - Accountant
    UserUpdate:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 60
        last_name:
          type: string
          maxLength: 60
        phone:
          type: string
          maxLength: 20
        role:
          $ref: '#/components/schemas/UserRole'
        certificate_number:
          type: string
          maxLength: 50
        certificate_valid_until:
          type: string
          format: date
          nullable: true
      required:
      - first_name
      - last_name
    UserUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 60
        last_name:
          type: string
          minLength: 1
          maxLength: 60
        phone:
          type: string
          maxLength: 20
        role:
          $ref: '#/components/schemas/UserRole'
        certificate_number:
          type: string
          maxLength: 50
        certificate_valid_until:
          type: string
          format: date
          nullable: true
      required:
      - first_name
      - last_name
    VatStatusEnum:
      enum:
      - applied
      - zero_rated
      - unset
      type: string
      description: |-
        * `applied` - A rate is stated and charged
        * `zero_rated` - The rate is stated and it is zero
        * `unset` - No rate has been stated, so the VAT cannot be computed
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - NOT_FOUND
      - PERMISSION_DENIED
      - AUTHENTICATION_FAILED
      - INTERNAL_ERROR
      - THROTTLED
      - SERVICE_UNAVAILABLE
      - CONSTRAINT_VIOLATION
      - API_VERSION_SUNSET
      - INVALID_TAX_NUMBER
      - INVALID_NATIONAL_ID
      - INVALID_PHONE
      - INVALID_POSTAL_CODE
      - END_DATE_BEFORE_START_DATE
      - INSTALLATION_DATE_IN_FUTURE
      - PLANNED_DATE_OUTSIDE_PERIOD
      - PLANNED_DATE_IN_PAST
      - RECORD_IN_USE
      - DUPLICATE_REGISTRATION_NUMBER
      - DUPLICATE_CONTRACT_NUMBER
      - DUPLICATE_TAX_NUMBER
      - DUPLICATE_NATIONAL_ID
      - EMAIL_ALREADY_REGISTERED
      - INVITATION_ALREADY_PENDING
      - IDEMPOTENCY_KEY_REUSED
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_IN_FLIGHT
      - ELEVATOR_ALREADY_CONTRACTED
      - NO_ACTIVE_CONTRACT_FOR_ELEVATOR
      - CONTACT_NOT_OF_CUSTOMER
      - CONTACT_HAS_NO_EMAIL
      - PORTAL_ACCOUNT_ALREADY_ACTIVE
      - PORTAL_EMAIL_IN_USE
      - INVOICE_TRANSITION_NOT_ALLOWED
      - SIGNATURE_EXISTS
      - SIGNATURE_NOT_EXPECTED
      - SIGNATURE_CANNOT_BE_DELETED
      - INVOICE_LINES_NEED_PRICE
      - MONTHLY_REPORT_NEEDS_EMAIL
      - REPORT_NO_RECIPIENT
      - REPORT_FILE_CANNOT_BE_DELETED
      - CATEGORY_NOT_UPLOADABLE
      - DUPLICATE_INVOICE_NUMBER
      - FAULT_TRANSITION_NOT_ALLOWED
      - PLAN_ROW_CLOSED
      - NOTIFICATION_EMAIL_LOCKED
      - LAST_OWNER_CANNOT_BE_DEACTIVATED
      - ONLY_TECHNICIANS_ARE_ASSIGNED
      - TECHNICIAN_RECORDS_OWN_VISITS
      - CANNOT_DEACTIVATE_SELF
      - BUILDING_CUSTOMER_MISMATCH
      - TERMINATION_REASON_REQUIRED
      - FIELD_REQUIRED_FOR_CUSTOMER_TYPE
      - FIELD_NOT_VALID_FOR_CUSTOMER_TYPE
      - STATUS_NOT_USER_SELECTABLE
      - CURRENCY_MISMATCH
      - PERIOD_CLOSED
      - ALREADY_REVERSED
      - INVOICE_HAS_COLLECTIONS
      - OVERPAYMENT_ON_INVOICE
      - INVALID_CREDENTIALS
      - ACCOUNT_LOCKED
      - ACCOUNT_INACTIVE
      - TOKEN_INVALID
      - TOKEN_EXPIRED
      - EMAIL_NOT_VERIFIED
      - FILE_TOO_LARGE
      - UNSUPPORTED_MIME_TYPE
      - UPLOAD_NOT_COMPLETED
      - ATTACHMENT_TARGET_MISMATCH
      description: |-
        * `VALIDATION_ERROR` - Request failed validation
        * `NOT_FOUND` - Record not found
        * `PERMISSION_DENIED` - Insufficient permissions
        * `AUTHENTICATION_FAILED` - Authentication failed
        * `INTERNAL_ERROR` - Unexpected server error
        * `THROTTLED` - Rate limit exceeded
        * `SERVICE_UNAVAILABLE` - A required service is not available
        * `CONSTRAINT_VIOLATION` - The request violates a database constraint
        * `API_VERSION_SUNSET` - This API version is no longer served
        * `INVALID_TAX_NUMBER` - Tax number failed its check digit
        * `INVALID_NATIONAL_ID` - National ID failed its check digit
        * `INVALID_PHONE` - Phone number is not a valid Turkish number
        * `INVALID_POSTAL_CODE` - Postal code must be five digits
        * `END_DATE_BEFORE_START_DATE` - End date must be after the start date
        * `INSTALLATION_DATE_IN_FUTURE` - Installation date cannot be in the future
        * `PLANNED_DATE_OUTSIDE_PERIOD` - A planned visit's day must fall inside its month
        * `PLANNED_DATE_IN_PAST` - A visit cannot be planned for a past day
        * `RECORD_IN_USE` - Record is referenced by other records
        * `DUPLICATE_REGISTRATION_NUMBER` - Registration number already exists for this company
        * `DUPLICATE_CONTRACT_NUMBER` - Contract number already exists for this company
        * `DUPLICATE_TAX_NUMBER` - Tax number already belongs to another customer of this company
        * `DUPLICATE_NATIONAL_ID` - National ID already belongs to another customer of this company
        * `EMAIL_ALREADY_REGISTERED` - E-mail address is already registered
        * `INVITATION_ALREADY_PENDING` - This address already holds an invitation that has not been accepted
        * `IDEMPOTENCY_KEY_REUSED` - Idempotency key was reused with a different request body
        * `IDEMPOTENCY_KEY_REQUIRED` - This request must carry an Idempotency-Key header
        * `IDEMPOTENCY_KEY_IN_FLIGHT` - A request with this Idempotency-Key is still being processed; retry later
        * `ELEVATOR_ALREADY_CONTRACTED` - Elevator is already covered by an open contract
        * `NO_ACTIVE_CONTRACT_FOR_ELEVATOR` - The named contract is not active or does not cover this elevator
        * `CONTACT_NOT_OF_CUSTOMER` - The contact does not belong to this customer
        * `CONTACT_HAS_NO_EMAIL` - The contact has no e-mail address to send a portal invitation to
        * `PORTAL_ACCOUNT_ALREADY_ACTIVE` - This contact already has an active portal account
        * `PORTAL_EMAIL_IN_USE` - Another active portal account already uses this e-mail address
        * `INVOICE_TRANSITION_NOT_ALLOWED` - The invoice draft is not in a state this action can be taken from
        * `SIGNATURE_EXISTS` - This visit already has its signature
        * `SIGNATURE_NOT_EXPECTED` - The visit was not recorded as signed, so it takes no signature
        * `SIGNATURE_CANNOT_BE_DELETED` - A visit's signature is kept for good and cannot be deleted
        * `INVOICE_LINES_NEED_PRICE` - Every line needs a price before the draft can be issued
        * `MONTHLY_REPORT_NEEDS_EMAIL` - A contact without an e-mail address cannot receive the monthly report
        * `REPORT_NO_RECIPIENT` - Nobody on this customer is set to receive the monthly report
        * `REPORT_FILE_CANNOT_BE_DELETED` - A monthly report's file belongs to the report and cannot be deleted
        * `CATEGORY_NOT_UPLOADABLE` - Files of this category are made by the server and cannot be uploaded
        * `DUPLICATE_INVOICE_NUMBER` - Another issued invoice of this company already has this number
        * `FAULT_TRANSITION_NOT_ALLOWED` - The fault is not in a state this action can be taken from
        * `PLAN_ROW_CLOSED` - The planned visit is done or cancelled; its day can no longer change
        * `NOTIFICATION_EMAIL_LOCKED` - This notification is always e-mailed and cannot be turned off
        * `LAST_OWNER_CANNOT_BE_DEACTIVATED` - A company must keep at least one active owner
        * `ONLY_TECHNICIANS_ARE_ASSIGNED` - Customer assignments apply to technicians only
        * `TECHNICIAN_RECORDS_OWN_VISITS` - A technician records maintenance visits in their own name only
        * `CANNOT_DEACTIVATE_SELF` - A user cannot deactivate their own account
        * `BUILDING_CUSTOMER_MISMATCH` - A building in a complex must share the complex's customer
        * `TERMINATION_REASON_REQUIRED` - A termination reason is required
        * `FIELD_REQUIRED_FOR_CUSTOMER_TYPE` - This customer type requires this field
        * `FIELD_NOT_VALID_FOR_CUSTOMER_TYPE` - This field does not apply to this customer type
        * `STATUS_NOT_USER_SELECTABLE` - This status is assigned by the system
        * `CURRENCY_MISMATCH` - The amount's currency differs from its account's or its cash account's
        * `PERIOD_CLOSED` - The date falls in a period the firm has closed
        * `ALREADY_REVERSED` - This document has already been cancelled
        * `INVOICE_HAS_COLLECTIONS` - Collections are applied to this invoice; cancel them first
        * `OVERPAYMENT_ON_INVOICE` - The amount applied exceeds the invoice's remaining balance
        * `INVALID_CREDENTIALS` - E-mail or password is incorrect
        * `ACCOUNT_LOCKED` - Too many failed attempts from this address; try again later
        * `ACCOUNT_INACTIVE` - Account is not active
        * `TOKEN_INVALID` - Token is invalid or has already been used
        * `TOKEN_EXPIRED` - Token has expired
        * `EMAIL_NOT_VERIFIED` - E-mail address has not been verified
        * `FILE_TOO_LARGE` - File exceeds the 10 MB limit
        * `UNSUPPORTED_MIME_TYPE` - File type is not accepted
        * `UPLOAD_NOT_COMPLETED` - No uploaded object was found for this key
        * `ATTACHMENT_TARGET_MISMATCH` - Attachment does not belong to the record it is being linked to
    ErrorResponse:
      type: object
      description: 'The shape of every error response. There is no `message` field:
        the backend sends codes, and the words live in the client''s translation file,
        so wording changes in one place and adding a language does not touch the API.'
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                required:
                - code
          required:
          - code
          - request_id
      required:
      - error
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    portalJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A customer portal access token (audience `portal`).

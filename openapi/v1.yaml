  /api/v1/buildings/:
    get:
      operationId: buildings_list
      description: |-
        CRUD over a company-owned model.

        PUT is not routed: partial update is the only update verb. A full replace
        means the client has to send every field it does not want cleared, and the
        moment the model grows a column, old clients start wiping it.
      parameters:
      - in: query
        name: complex
        schema:
          type: string
          format: uuid
      - in: query
        name: customer
        schema:
          type: string
          format: uuid
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          enum:
          - commercial
          - hospital
          - hotel
          - industrial
          - mall
          - mixed_use
          - public
          - residential
          - school
        description: |-
          * `residential` - Residential
          * `commercial` - Commercial
          * `mixed_use` - Mixed use
          * `public` - Public
          * `hospital` - Hospital
          * `mall` - Mall
          * `hotel` - Hotel
          * `school` - School
          * `industrial` - Industrial

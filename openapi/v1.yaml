    PasswordChangeRequest:
      type: object
      description: |-
        The current password and the wanted one.

        The new one runs through `PasswordField`, which is the same field
        registration uses — length from `settings.MIN_PASSWORD_LENGTH`, the common
        password blocklist, and the similarity check. There is no second policy
        here and there must never be one: a floor written twice is a floor that
        only moves in one of the two places.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 6
      required:
      - current_password
      - new_password
    PasswordResetConfirmRequest:
      type: object
      description: |-
        Rejects fields it does not know about.

        DRF ignores unknown keys by default, which silently swallows a typo: the
        client sends `emial`, gets a 200, and the value never arrives. Failing is
        the kinder answer.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          writeOnly: true
          minLength: 6
      required:
      - password
      - token
    PasswordResetRequestRequest:
      type: object
      description: |-
        Rejects fields it does not know about.

        DRF ignores unknown keys by default, which silently swallows a typo: the
        client sends `emial`, gets a 200, and the value never arrives. Failing is
        the kinder answer.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 150
      required:
      - email
    PatchedBuildingWriteRequest:
      type: object
      properties:
        customer:
          type: string
          format: uuid
        complex:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 150
        type:
          $ref: '#/components/schemas/BuildingType'
        neighborhood:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        street:
          type: string
          maxLength: 150
        building_number:
          type: string
          maxLength: 20
        address_note:
          type: string
          minLength: 1
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        floor_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        unit_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true

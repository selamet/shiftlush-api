      type: object
      description: |-
        A plan row on the day's road: where it is, and how far from the stop before.

        The position is the building's, or its estate's when the building has
        none; null when neither is known, and the stop is then one of `unplaced`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        elevator:
          type: string
          format: uuid
          readOnly: true
        elevator_name:
          type: string
          readOnly: true
        building:
          type: string
          format: uuid
          readOnly: true
        building_name:
          type: string
          readOnly: true
        neighborhood_name:
          type: string
          readOnly: true
          nullable: true
        district:
          type: integer
          readOnly: true
          nullable: true
        district_name:
          type: string
          readOnly: true
          nullable: true
        customer:
          type: string
          format: uuid
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        period:
          type: string
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
        planned_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        technician:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        technician_name:
          type: string
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PlannedVisitStatus'
          readOnly: true
        visit:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        latest_visit_status:
          readOnly: true
          nullable: true
          description: |-
            Status of the visit linked to this row: the one that closed it when `done`, the latest attempt while `planned`. Null when nobody has been yet. `planned` with a status here means tried, not done.

            * `completed` - Completed
            * `incomplete` - Incomplete
            * `access_denied` - Access denied
          oneOf:
          - $ref: '#/components/schemas/MaintenanceVisitStatus'
          - $ref: '#/components/schemas/NullEnum'
        is_overdue:
          type: boolean
          description: Still planned and past its due date, by the Istanbul calendar.
          readOnly: true
        days_overdue:
          type: integer
          nullable: true
          readOnly: true
          description: 'Days since `due_date` while the row is still planned and past
            it; null otherwise. The due date can fall before the row''s own month:
            that is how long the lift has been overdue.'
        manually_edited:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          readOnly: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          readOnly: true
        leg_km:
          type: number
          format: double
          nullable: true
          readOnly: true
          description: Straight-line km from the previous stop (from the firm's starting
            point for the first); null when either end has no position.
      required:
      - building
      - building_name
      - created_at
      - customer
      - customer_name
      - days_overdue
      - district
      - district_name
      - due_date
      - elevator
      - elevator_name
      - id
      - is_overdue
      - latest_visit_status
      - latitude
      - leg_km
      - longitude
      - manually_edited
      - neighborhood_name
      - period
      - planned_date
      - status
      - technician
      - technician_name
      - updated_at
      - visit
    Session:
      type: object
      description: |-
        One signed-in device, not one refresh token.

        `id` is the chain rather than the row's primary key. The row is replaced
        every time the access token is refreshed, so a client that listed sessions,
        let the user read the screen, and then revoked a row id would hit a session
        that no longer exists roughly as often as not. The chain id is stable for
        as long as the session is.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        signed_in_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        user_agent:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        is_current:
          type: boolean
          description: |-
            Whether this is the session the request itself arrived on.

            Answered from the refresh cookie, which is the only thing that names a
            session — the access token says who the caller is, never which of their
            devices is asking.
          readOnly: true
      required:
      - expires_at
      - id
      - ip_address
      - is_current
      - last_used_at
      - signed_in_at
      - user_agent

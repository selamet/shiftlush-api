openapi: 3.0.3
info:
  title: ShiftLush API
  version: v1
paths:
  /api/v1/attachments/:
    get:
      operationId: attachments_list
      description: |-
        Files, without the bytes.

        There is no update: a file is not edited, it is replaced. Correcting one
        means uploading the new version and deleting the old, which leaves both in
        the audit trail — where a silent overwrite would leave neither.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - ce_certificate
          - declaration_of_conformity
          - inspection_report
          - logo
          - monthly_report
          - other
          - permit
          - photo
          - signature
          - signed_contract
        description: |-
          * `photo` - Photo
          * `ce_certificate` - CE certificate
          * `declaration_of_conformity` - Declaration of conformity
          * `permit` - Permit
          * `signed_contract` - Signed contract
          * `inspection_report` - Inspection report
          * `logo` - Logo
          * `signature` - Signature
          * `monthly_report` - Monthly report
          * `other` - Other
      - in: query
        name: object_id
        schema:
          type: string
          format: uuid
      - in: query
        name: object_type
        schema:
          type: string
          enum:
          - building
          - company
          - contract
          - customer
          - elevator
          - fault
          - inspection
          - maintenance_visit
          - user
        description: |-
          * `elevator` - Elevator
          * `building` - Building
          * `contract` - Contract
          * `customer` - Customer
          * `company` - Company
          * `user` - User
          * `maintenance_visit` - Maintenance visit
          * `fault` - Fault
          * `inspection` - Inspection
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttachmentList'
          description: ''
    post:
      operationId: attachments_create
      description: |-
        Confirm an upload that has already landed.

        Retrying is safe: a storage key names one object, so a second
        confirmation returns the record the first one made.
      tags:
      - attachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/{id}/:
    get:
      operationId: attachments_retrieve
      description: |-
        Files, without the bytes.

        There is no update: a file is not edited, it is replaced. Correcting one
        means uploading the new version and deleting the old, which leaves both in
        the audit trail — where a silent overwrite would leave neither.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: attachments_destroy
      description: |-
        Files, without the bytes.

        There is no update: a file is not edited, it is replaced. Correcting one
        means uploading the new version and deleting the old, which leaves both in
        the audit trail — where a silent overwrite would leave neither.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/attachments/{id}/download-url/:
    get:
      operationId: attachments_download_url_retrieve
      description: |-
        A URL that works for a few minutes and only for this file.

        The bucket is never public. Every read is a fresh signature, which is
        also why these URLs are not worth caching or embedding anywhere.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrl'
          description: ''
  /api/v1/attachments/upload-url/:
    post:
      operationId: attachments_upload_url_create
      description: |-
        Ask for permission to upload, then upload straight to storage.

        No record is created here. A row for a file that was never uploaded is
        worse than no row: it appears in lists, it cannot be downloaded, and
        nothing ever cleans it up.
      tags:
      - attachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadUrlRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadUrlRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
          description: ''
  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      description: |-
        Read-only, and only for owners and admins.

        There is no create, update or delete anywhere: a log that can be edited is
        not evidence. Writes reach this table through signals only.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - create
          - delete
          - update
        description: |-
          * `create` - Create
          * `update` - Update
          * `delete` - Delete
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: record_id
        schema:
          type: string
          format: uuid
      - in: query
        name: since
        schema:
          type: string
          format: date-time
      - in: query
        name: table_name
        schema:
          type: string
      - in: query
        name: until
        schema:
          type: string
          format: date-time
      - in: query
        name: user_id
        schema:
          type: string
          format: uuid
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/email/resend:
    post:
      operationId: auth_email_resend_create
      description: |-
        Send the verification link again.

        The only way out for somebody who mistyped their address at registration or
        lost the message. Answers the same way whether or not there was anything to
        send: an authenticated caller asking about their own address learns nothing
        either way, and a verified account should not be told it is verified by a
        different status code.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/email/verify:
    post:
      operationId: auth_email_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/password:
    post:
      operationId: auth_password_create
      description: 'Verifies the current password, applies the same password policy
        as registration, and ends every other session on the account. The session
        making the call survives: a new refresh cookie is set and a new access token
        is returned. A wrong current password answers 422 INVALID_CREDENTIALS, distinct
        from the 400 a policy failure gives.'
      summary: Change the signed-in user's password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/password-reset:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Exchanges the refresh cookie for a new access token.

        Open to unauthenticated callers by definition: the access token has expired,
        which is why the client is here.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/sessions:
    get:
      operationId: auth_sessions_list
      description: 'One entry per signed-in device, not per refresh token: refresh
        rotation replaces the stored token roughly every fifteen minutes and every
        replacement stays in the same session. `id` is stable for the life of the
        session and is what the revoke endpoint takes. Exactly one entry has `is_current:
        true` — the session this request arrived on — unless the request carried no
        refresh cookie, in which case none does.'
      summary: List the caller's own sessions
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/sessions/{session_id}:
    delete:
      operationId: auth_sessions_destroy
      description: Ends the session and every refresh token in it. The refresh token
        that device holds is refused from that moment, and replaying it trips the
        existing reuse detection. Revoking the current session is allowed and is equivalent
        to signing out here — the refresh cookie is cleared in the response. A session
        id belonging to another user, or one that has already ended, answers 404.
      summary: End one of the caller's sessions
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/sessions/revoke-others:
    post:
      operationId: auth_sessions_revoke_others_create
      description: The session this request arrives on is kept; every other session
        on the account ends immediately. If the request carries no usable refresh
        cookie there is no session to keep, and all of them end — including the caller's,
        who has to sign in again.
      summary: End every session except the caller's own
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/buildings/:
    get:
      operationId: buildings_list
      description: |-
        CRUD over a company-owned model.

        PUT is not routed: partial update is the only update verb. A full replace
        means the client has to send every field it does not want cleared, and the
        moment the model grows a column, old clients start wiping it.
      parameters:
      - in: query
        name: complex
        schema:
          type: string
          format: uuid
      - in: query
        name: customer
        schema:
          type: string
          format: uuid
      - in: query
        name: has_location
        schema:
          type: boolean
        description: 'true: buildings with both coordinates; false: those missing
          either.'
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          enum:
          - commercial
          - hospital
          - hotel
          - industrial
          - mall
          - mixed_use
          - public
          - residential
          - school
        description: |-
          * `residential` - Residential
          * `commercial` - Commercial
          * `mixed_use` - Mixed use
          * `public` - Public
          * `hospital` - Hospital
          * `mall` - Mall
          * `hotel` - Hotel
          * `school` - School
          * `industrial` - Industrial
      tags:
      - buildings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuildingReadList'
          description: ''
    post:
      operationId: buildings_create
      description: |-
        CRUD over a company-owned model.

        PUT is not routed: partial update is the only update verb. A full replace
        means the client has to send every field it does not want cleared, and the
        moment the model grows a column, old clients start wiping it.
      tags:
      - buildings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BuildingWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BuildingWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingRead'
          description: ''
  /api/v1/buildings/{id}/:

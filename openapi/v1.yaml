components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
    AddElevatorsRequest:
      type: object
      properties:
        elevator_ids:
          type: array
          items:
            type: string
            format: uuid
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
      required:
      - elevator_ids
    Attachment:
      type: object
      description: |-
        What a client is told about a file.

        `storage_key` and `storage_backend` are absent on purpose. They are how the
        server finds the bytes, not facts about the document, and publishing them
        would tie the API contract to the layout of a bucket that is expected to
        change when the personal-data categories move provider.
      properties:
        id:

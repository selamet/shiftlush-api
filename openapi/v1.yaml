components:
  schemas:
    AccountCreateRequest:
      type: object
      description: |-
        Open an account for a party that has none: a staff member, mostly.

        A customer's account comes with the customer, and a supplier's with the
        supplier; asking again for one that exists is `unique`.
      properties:
        kind:
          $ref: '#/components/schemas/LedgerAccountKind'
        customer:
          type: string
          format: uuid
          description: For `customer`.
        supplier:
          type: string
          format: uuid
          description: For `supplier`.
        user:
          type: string
          format: uuid
          description: 'For `staff`: a member of the firm.'
        currency:
          type: string
          minLength: 1
          default: TRY
          pattern: ^[A-Z]{3}$
      required:
      - kind
    AccountDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/LedgerAccountKind'
          readOnly: true
        name:
          type: string
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        supplier:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        user:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        currency:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
          description: 'Debits less credits. Positive: the party owes the firm.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_movement:
          allOf:
          - $ref: '#/components/schemas/Movement'
          nullable: true
          readOnly: true
      required:
      - balance
      - created_at
      - currency
      - customer
      - id
      - is_active
      - kind
      - last_movement
      - name
      - supplier
      - user
    AccountRead:
      type: object
      properties:
        id:
          type: string
          format: uuid

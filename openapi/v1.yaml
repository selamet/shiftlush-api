openapi: 3.0.3
info:
  title: ShiftLush API
  version: v1
paths:
  /api/v1/attachments/:
    get:
      operationId: attachments_list
      description: |-
        Files, without the bytes.

        There is no update: a file is not edited, it is replaced. Correcting one
        means uploading the new version and deleting the old, which leaves both in
        the audit trail — where a silent overwrite would leave neither.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - ce_certificate
          - declaration_of_conformity
          - inspection_report
          - logo
          - other
          - permit
          - photo
          - signed_contract
        description: |-
          * `photo` - Photo
          * `ce_certificate` - CE certificate
          * `declaration_of_conformity` - Declaration of conformity
          * `permit` - Permit
          * `signed_contract` - Signed contract
          * `inspection_report` - Inspection report
          * `logo` - Logo
          * `other` - Other
      - in: query
        name: object_id
        schema:
          type: string
          format: uuid
      - in: query
        name: object_type
        schema:
          type: string
          enum:
          - building
          - company
          - contract
          - customer
          - elevator
          - user
        description: |-
          * `elevator` - Elevator
          * `building` - Building
          * `contract` - Contract
          * `customer` - Customer
          * `company` - Company
          * `user` - User
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttachmentList'
          description: ''
    post:
      operationId: attachments_create
      description: |-
        Confirm an upload that has already landed.

        Not wrapped in replay protection: this call is idempotent by nature. A
        storage key identifies exactly one object, so confirming it twice returns
        the same record rather than creating a second one.
      tags:
      - attachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/{id}/:
    get:
      operationId: attachments_retrieve
      description: |-
        Files, without the bytes.

        There is no update: a file is not edited, it is replaced. Correcting one
        means uploading the new version and deleting the old, which leaves both in
        the audit trail — where a silent overwrite would leave neither.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: attachments_destroy
      description: |-
        Files, without the bytes.

        There is no update: a file is not edited, it is replaced. Correcting one
        means uploading the new version and deleting the old, which leaves both in
        the audit trail — where a silent overwrite would leave neither.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/attachments/{id}/download-url/:
    get:
      operationId: attachments_download_url_retrieve
      description: |-
        A URL that works for a few minutes and only for this file.

        The bucket is never public. Every read is a fresh signature, which is
        also why these URLs are not worth caching or embedding anywhere.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrl'
          description: ''
  /api/v1/attachments/upload-url/:
    post:
      operationId: attachments_upload_url_create
      description: |-
        Ask for permission to upload, then upload straight to storage.

        No record is created here. A row for a file that was never uploaded is
        worse than no row: it appears in lists, it cannot be downloaded, and
        nothing ever cleans it up.
      tags:
      - attachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadUrlRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadUrlRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
          description: ''
  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      description: |-
        Read-only, and only for owners and admins.

        There is no create, update or delete anywhere: a log that can be edited is
        not evidence. Writes reach this table through signals only.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - create
          - delete
          - update
        description: |-
          * `create` - Create
          * `update` - Update
          * `delete` - Delete
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: record_id
        schema:
          type: string
          format: uuid
      - in: query
        name: since
        schema:
          type: string
          format: date-time
      - in: query
        name: table_name
        schema:
          type: string
      - in: query
        name: until
        schema:
          type: string
          format: date-time
      - in: query
        name: user_id
        schema:
          type: string
          format: uuid
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''

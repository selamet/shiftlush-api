    ReverseGeocode:
      type: object
      description: |-
        What a dropped pin resolves to.

        Ids rather than names, because the form the client is filling in is a
        cascade of selects over the address tables — a name would only send it back
        to look the row up, and would leave it guessing when the lookup found two.
      properties:
        province:
          allOf:
          - $ref: '#/components/schemas/GeocodeMatch'
          readOnly: true
          nullable: true
        district:
          allOf:
          - $ref: '#/components/schemas/GeocodeMatch'
          readOnly: true
          nullable: true
        neighborhood:
          allOf:
          - $ref: '#/components/schemas/GeocodeMatch'
          readOnly: true
          nullable: true
        unmatched:
          type: array
          items:
            $ref: '#/components/schemas/UnmatchedEnum'
          readOnly: true
          description: 'Levels that could not be resolved and must be chosen by the
            user. Stated explicitly rather than left as three nulls: a client that
            reads null as ''not filled in yet'' behaves differently from one that
            reads it as ''we looked and found nothing'', and only one of those asks
            the user.'
      required:
      - district
      - neighborhood
      - province
      - unmatched

openapi: 3.0.3
info:
  title: ShiftLush API
  version: v1
paths:
  /api/v1/auth/email/verify:
    post:
      operationId: auth_email_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/invitations/accept:
    post:
      operationId: auth_invitations_accept_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/password-reset:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Exchanges the refresh cookie for a new access token.

        Open to unauthenticated callers by definition: the access token has expired,
        which is why the client is here.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
components:
  schemas:
    CurrentUser:
      type: object
      description: |-
        What `/auth/me` returns.

        Read-only, and narrower than the model on purpose: `national_id`,
        `password`, `failed_login_count` and `locked_until` are all on User and none
        of them belong in a response.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        certificate_number:
          type: string
          readOnly: true
        certificate_valid_until:
          type: string
          format: date
          readOnly: true
          nullable: true
      required:
      - certificate_number
      - certificate_valid_until
      - company_id
      - email
      - first_name
      - full_name
      - id
      - is_active
      - is_email_verified
      - last_login_at
      - last_name
      - phone
      - role
    EmailVerifyRequest:
      type: object
      description: |-
        Rejects fields it does not know about.

        DRF ignores unknown keys by default, which silently swallows a typo: the
        client sends `emial`, gets a 200, and the value never arrives. Failing is
        the kinder answer.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - token
    InvitationAcceptRequest:
      type: object
      description: |-
        Rejects fields it does not know about.

        DRF ignores unknown keys by default, which silently swallows a typo: the
        client sends `emial`, gets a 200, and the value never arrives. Failing is
        the kinder answer.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - password
      - token
    LoginRequest:
      type: object
      description: |-
        Rejects fields it does not know about.

        DRF ignores unknown keys by default, which silently swallows a typo: the
        client sends `emial`, gets a 200, and the value never arrives. Failing is
        the kinder answer.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    PasswordResetConfirmRequest:
      type: object
      description: |-
        Rejects fields it does not know about.

        DRF ignores unknown keys by default, which silently swallows a typo: the
        client sends `emial`, gets a 200, and the value never arrives. Failing is
        the kinder answer.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - password
      - token
    PasswordResetRequestRequest:
      type: object
      description: |-
        Rejects fields it does not know about.

        DRF ignores unknown keys by default, which silently swallows a typo: the
        client sends `emial`, gets a 200, and the value never arrives. Failing is
        the kinder answer.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 150
      required:
      - email
    RegisterRequest:
      type: object
      description: |-
        Rejects fields it does not know about.

        DRF ignores unknown keys by default, which silently swallows a typo: the
        client sends `emial`, gets a 200, and the value never arrives. Failing is
        the kinder answer.
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 200
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        first_name:
          type: string
          minLength: 1
          maxLength: 60
        last_name:
          type: string
          minLength: 1
          maxLength: 60
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - display_name
      - email
      - first_name
      - last_name
      - legal_name
      - password
    RoleEnum:
      enum:
      - owner
      - admin
      - operations
      - technician
      - accountant
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `operations` - Operations
        * `technician` - Technician
        * `accountant` - Accountant
    TokenResponse:
      type: object
      description: |-
        The body of a successful sign-in.

        Only the access token is here. The refresh token goes out as an httpOnly
        cookie and never touches JavaScript — putting it in the body would make it
        readable by any script that gets injected into the page.
      properties:
        access:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/CurrentUser'
          readOnly: true
      required:
      - access
      - user
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

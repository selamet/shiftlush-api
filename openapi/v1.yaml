        moment the model grows a column, old clients start wiping it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this building.
        required: true
      tags:
      - buildings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingRead'
          description: ''
    patch:
      operationId: buildings_partial_update
      description: |-
        CRUD over a company-owned model.

        PUT is not routed: partial update is the only update verb. A full replace
        means the client has to send every field it does not want cleared, and the
        moment the model grows a column, old clients start wiping it.
      parameters:
